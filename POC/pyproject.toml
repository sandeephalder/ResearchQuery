[project]
name = "poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.30.0",
    "httpx>=0.28.0",
    "tqdm>=4.70.0",
    "pymupdf>=1.28.2",
    "pymupdf-layout>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "flagembedding>=1.4.2",
    "nemoguardrails>=0.24.0",
    "langgraph>=1.2.11",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "clerk-backend-api>=7.0.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-community>=0.4.2",
    "rank-bm25>=0.2.2",
    "ragas>=0.4.3",
    "deepeval>=4.2.1",
    "mlflow>=3.16.0",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The wiring tests open one AgentPipeline for the session — BGE-M3, the
# cross-encoder, the embedded Qdrant store and the NeMo rails — and that store
# admits a single process. So the suite is deliberately not run in parallel, and
# `-p no:randomly` keeps the session fixture's ordering predictable.
addopts = "-ra --strict-markers"
markers = [
    "live: needs real models and API keys; enabled with --live or LIVE_TESTS=1",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.uv]
# deepeval pins `click<8.4.0` for its own CLI; huggingface-hub 1.30 requires
# `click>=8.4.2`, and huggingface-hub is what loads every local model in this
# repo. The pin is the softer of the two — deepeval is driven here through
# pytest and its Python API, never through its `deepeval` command — so it is
# the one that gives.
override-dependencies = ["click>=8.4.2,<9.0.0"]

# LiteLLM quickstart stack: the gateway plus a Postgres database that stores
# models, virtual keys, and spend logs. Used by https://docs.litellm.ai/docs/proxy/docker_quick_start
#
# The credentials below are placeholders for local evaluation. Before any real
# use, set LITELLM_MASTER_KEY and LITELLM_SALT_KEY to long random values, and
# pin the image to a release tag instead of `latest`.
services:

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  litellm:
    image: docker.litellm.ai/berriai/litellm-database:latest
    ports:
      - "4000:4000"
    volumes:
      - ./config.yml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    environment:
      # Both come from POC/.env via run.sh. The defaults are throwaway values
      # for a local run — set real ones before this is reachable by anything
      # else. LITELLM_SALT_KEY must then stay stable: it encrypts provider keys
      # at rest, so rotating it makes everything already stored undecryptable.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-dummypass}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:-sk-local-dev-salt-change-me}"
      DATABASE_URL: "postgresql://litellm:dummy@db:5432/litellm"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORE_MODEL_IN_DB: "True"
      # Provider keys referenced by config.yml as os.environ/NAME. run.sh exports
      # these from POC/.env; empty is fine for a provider you are not using.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "dummy"
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data:
